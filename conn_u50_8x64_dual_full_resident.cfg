[connectivity]
nk=control_cache_8x64_dual_core_nk:1:cc8_ctrl
nk=compute_core_8x64_unified_nk:2:cc8_cu0.cc8_cu1
nk=cc8_status_sink_nk:1:cc8_status

# Controller core 0 -> unified compute instance 1.
stream_connect=cc8_ctrl.core0_task_stream:cc8_cu0.task_stream:16
stream_connect=cc8_ctrl.core0_activation_stream:cc8_cu0.activation_stream:16
stream_connect=cc8_ctrl.core0_weight_stream0:cc8_cu0.weight_stream0:16
stream_connect=cc8_ctrl.core0_weight_stream1:cc8_cu0.weight_stream1:16
stream_connect=cc8_ctrl.core0_weight_stream2:cc8_cu0.weight_stream2:16
stream_connect=cc8_ctrl.core0_weight_stream3:cc8_cu0.weight_stream3:16
stream_connect=cc8_ctrl.core0_vector_input0_stream:cc8_cu0.vector_input0_stream:16
stream_connect=cc8_ctrl.core0_vector_input1_stream:cc8_cu0.vector_input1_stream:16
stream_connect=cc8_cu0.out_stream:cc8_ctrl.core0_result_stream:16

# Controller core 1 -> unified compute instance 2.
stream_connect=cc8_ctrl.core1_task_stream:cc8_cu1.task_stream:16
stream_connect=cc8_ctrl.core1_activation_stream:cc8_cu1.activation_stream:16
stream_connect=cc8_ctrl.core1_weight_stream0:cc8_cu1.weight_stream0:16
stream_connect=cc8_ctrl.core1_weight_stream1:cc8_cu1.weight_stream1:16
stream_connect=cc8_ctrl.core1_weight_stream2:cc8_cu1.weight_stream2:16
stream_connect=cc8_ctrl.core1_weight_stream3:cc8_cu1.weight_stream3:16
stream_connect=cc8_ctrl.core1_vector_input0_stream:cc8_cu1.vector_input0_stream:16
stream_connect=cc8_ctrl.core1_vector_input1_stream:cc8_cu1.vector_input1_stream:16
stream_connect=cc8_cu1.out_stream:cc8_ctrl.core1_result_stream:16

stream_connect=cc8_ctrl.status_stream:cc8_status.status_stream:16

# Each pair (j, j+8) uses two private 27-layer head banks and one shared
# 9-layer tail bank. The two tile-parity groups do not read the shared tail
# bank in the same MM task.
sp=cc8_ctrl.layer_weights_shard0:HBM[0:2]
sp=cc8_ctrl.layer_weights_shard1:HBM[3:5]
sp=cc8_ctrl.layer_weights_shard2:HBM[6:8]
sp=cc8_ctrl.layer_weights_shard3:HBM[9:11]
sp=cc8_ctrl.layer_weights_shard4:HBM[12:14]
sp=cc8_ctrl.layer_weights_shard5:HBM[15:17]
sp=cc8_ctrl.layer_weights_shard6:HBM[18:20]
sp=cc8_ctrl.layer_weights_shard7:HBM[21:23]
sp=cc8_ctrl.layer_weights_shard8:HBM[0:2]
sp=cc8_ctrl.layer_weights_shard9:HBM[3:5]
sp=cc8_ctrl.layer_weights_shard10:HBM[6:8]
sp=cc8_ctrl.layer_weights_shard11:HBM[9:11]
sp=cc8_ctrl.layer_weights_shard12:HBM[12:14]
sp=cc8_ctrl.layer_weights_shard13:HBM[15:17]
sp=cc8_ctrl.layer_weights_shard14:HBM[18:20]
sp=cc8_ctrl.layer_weights_shard15:HBM[21:23]

# Data traffic uses the four remaining supported pseudo-channels.
sp=cc8_ctrl.output_port0:HBM[24]
sp=cc8_ctrl.input_port0:HBM[24]
sp=cc8_ctrl.output_port1:HBM[25]
sp=cc8_ctrl.input_port1:HBM[25]
sp=cc8_ctrl.aux_port0:HBM[26]
sp=cc8_ctrl.aux_port1:HBM[27]

# KV traffic is phase-disjoint from weight streaming and fits beside the two
# shared tail buffers in HBM[2] and HBM[5].
sp=cc8_ctrl.kv_cache_k:HBM[2]
sp=cc8_ctrl.kv_cache_v:HBM[5]
sp=cc8_status.status_output:HBM[27]
