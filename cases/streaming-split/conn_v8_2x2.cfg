[connectivity]
# hw nk=1: control_cache_core + 1×V8-2_s
# (U50 LUT constraint: one V8-2_s CU = 795k LUT, while two CUs = 1.59M > the device's 871k LUT.)
nk=control_cache_core:1:cc_0
nk=qkv_tile_kernel_cc_qwen_small_core_v8_2_s:1:v82_0

# control_cache_core HBM ports (7 m_axi: in/out/4x weight/op_program)
sp=cc_0.hidden_in:HBM[0]
sp=cc_0.hidden_out:HBM[1]
sp=cc_0.weight_hbm_0:HBM[2]
sp=cc_0.weight_hbm_1:HBM[3]
sp=cc_0.weight_hbm_2:HBM[4]
sp=cc_0.weight_hbm_3:HBM[5]
sp=cc_0.op_program:HBM[6]

# Explicitly map the V8-2_s param1/param2 ports to the same bank.
sp=v82_0.param1:HBM[0]
sp=v82_0.param2:HBM[0]

# Streams (one compute CU: one each of input/weight/output_lo/output_hi and ctrl_stream).
stream_connect=cc_0.to_compute_0:v82_0.input_stream
stream_connect=cc_0.weight_stream_0:v82_0.weight_stream_0
stream_connect=cc_0.weight_stream_1:v82_0.weight_stream_1
stream_connect=cc_0.weight_stream_2:v82_0.weight_stream_2
stream_connect=cc_0.weight_stream_3:v82_0.weight_stream_3
stream_connect=cc_0.ctrl_stream:v82_0.ctrl_stream
stream_connect=v82_0.output_stream_lo:cc_0.from_compute_0_lo
stream_connect=v82_0.output_stream_hi:cc_0.from_compute_0_hi
