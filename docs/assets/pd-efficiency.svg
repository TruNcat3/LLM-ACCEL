<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Prefill and decode modeled useful-MAC efficiency by KV context</title>
  <desc id="desc">Eight-row prefill efficiency decreases from 94.812 percent at context 64 to 72.310 percent at context 1024. Single-row decode efficiency decreases from 13.296 to 11.607 percent.</desc>
  <rect width="960" height="440" rx="16" fill="#0d1117"/>
  <style>
    .title{font-size:22px;font-weight:700;fill:#f0f6fc}.sub{font-size:14px;fill:#8b949e}.label{font-size:14px;font-weight:600;fill:#c9d1d9}.tick{font-size:12px;fill:#8b949e}.grid{stroke:#30363d;stroke-width:1}.p{stroke:#3fb950;fill:none;stroke-width:4}.d{stroke:#58a6ff;fill:none;stroke-width:4}.pointp{fill:#3fb950}.pointd{fill:#58a6ff}.value{font-size:13px;font-weight:700;fill:#f0f6fc}
  </style>
  <text class="title" x="36" y="40">Query-block height dominates datapath efficiency</text>
  <text class="sub" x="36" y="64">Operator-level Q2.14 diagnostic · modeled useful-MAC efficiency</text>
  <g>
    <line class="grid" x1="90" y1="100" x2="910" y2="100"/><text class="tick" x="45" y="105">100%</text>
    <line class="grid" x1="90" y1="160" x2="910" y2="160"/><text class="tick" x="53" y="165">80%</text>
    <line class="grid" x1="90" y1="220" x2="910" y2="220"/><text class="tick" x="53" y="225">60%</text>
    <line class="grid" x1="90" y1="280" x2="910" y2="280"/><text class="tick" x="53" y="285">40%</text>
    <line class="grid" x1="90" y1="340" x2="910" y2="340"/><text class="tick" x="53" y="345">20%</text>
    <line class="grid" x1="90" y1="400" x2="910" y2="400"/><text class="tick" x="61" y="405">0%</text>
  </g>
  <polyline class="p" points="130,115.6 370,132.9 610,152.4 850,183.1"/>
  <polyline class="d" points="130,360.1 370,361.3 610,362.7 850,365.2"/>
  <g>
    <circle class="pointp" cx="130" cy="115.6" r="7"/><text class="value" x="105" y="99">94.81%</text>
    <circle class="pointp" cx="370" cy="132.9" r="7"/><text class="value" x="345" y="116">89.02%</text>
    <circle class="pointp" cx="610" cy="152.4" r="7"/><text class="value" x="585" y="136">82.52%</text>
    <circle class="pointp" cx="850" cy="183.1" r="7"/><text class="value" x="825" y="167">72.31%</text>
    <circle class="pointd" cx="130" cy="360.1" r="7"/><text class="value" x="105" y="348">13.30%</text>
    <circle class="pointd" cx="370" cy="361.3" r="7"/><text class="value" x="345" y="349">12.91%</text>
    <circle class="pointd" cx="610" cy="362.7" r="7"/><text class="value" x="585" y="350">12.43%</text>
    <circle class="pointd" cx="850" cy="365.2" r="7"/><text class="value" x="825" y="353">11.61%</text>
  </g>
  <text class="tick" x="119" y="425">64</text><text class="tick" x="354" y="425">256</text><text class="tick" x="594" y="425">512</text><text class="tick" x="832" y="425">1024</text>
  <text class="label" x="425" y="426">KV context length</text>
  <line class="p" x1="620" y1="82" x2="654" y2="82"/><text class="label" x="664" y="87">Prefill · 8 rows</text>
  <line class="d" x1="790" y1="82" x2="824" y2="82"/><text class="label" x="834" y="87">Decode · 1 row</text>
</svg>
