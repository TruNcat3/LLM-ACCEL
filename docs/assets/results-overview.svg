<text x="48" y="600" fill="#a2abb7" stroke="none" font-size="12" font-weight="400">Each quantized run: 171,520 hidden/KV values exact against its production-C reference; wave-disabled controls archived.</text>
<text x="48" y="626" fill="#a2abb7" stroke="none" font-size="12" font-weight="400">W4 has twice the logical peak of W8. Efficiency percentages alone do not measure latency or physical PE occupancy.</text>
<text x="28" y="677" fill="#a2abb7" stroke="none" font-size="12" font-weight="400">Sources: qwen3b-e2e-l2-20260821 · q214-resident-fix-20260818 · quantized-layer-20261007</text>
<text x="28" y="699" fill="#a2abb7" stroke="none" font-size="12" font-weight="400">Not physical-board measurements or trained-model accuracy. The Fix16 and quantized workloads differ; no cross-panel speedup is claimed.</text>
